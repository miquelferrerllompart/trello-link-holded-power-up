<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holded Info</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #172b4d;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      color: #44546f;
      margin-bottom: 6px;
    }
    .tags {
      display: grid;
      gap: 6px;
    }
    .tag {
      display: grid;
      grid-template-columns: 16px 12px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      max-width: 100%;
      line-height: 20px;
      transition: background 0.15s, color 0.15s;
    }
    .tag-contact {
      background: #e4f0f6;
      color: #0c66a1;
    }
    .tag-project {
      background: #e6f4ea;
      color: #1b7742;
    }
    .tag-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .tag-open-icon {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity 0.15s, transform 0.15s;
      fill: currentColor;
    }
    .tag:hover .tag-open-icon,
    .tag:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tag:hover .tag-name,
    .tag:focus-visible .tag-name {
      overflow: visible;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .tag-address {
      color: #5e6c84;
      font-weight: 400;
      font-size: 12px;
      cursor: help;
      white-space: nowrap;
    }
    .tag-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .tag:hover .tag-close,
    .tag:focus-within .tag-close {
      opacity: 1;
    }
    .tag-close-icon {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }
    .empty {
      color: #6b778c;
      font-size: 13px;
      padding: 4px 0;
    }
    .important-message {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid #f5cd47;
      border-radius: 6px;
      background: #fff7d6;
      color: #7f5f01;
      font-size: 13px;
      line-height: 18px;
      white-space: pre-line;
    }
    .important-label {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .documents {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #091e4224;
    }
    .documents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .documents-count {
      color: #626f86;
      font-size: 11px;
      line-height: 14px;
    }
    .documents-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .documents-hint {
      min-width: 0;
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
    }
    .documents-button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: #091e420f;
      color: #172b4d;
      cursor: pointer;
      flex: 0 0 auto;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      padding: 6px 10px;
    }
    .documents-button:hover {
      background: #091e4224;
    }
    .documents-button:focus-visible,
    .documents-tab:focus-visible,
    .document-row:focus-visible {
      outline: 2px solid #388bff;
      outline-offset: 2px;
    }
    .documents-button[disabled] {
      cursor: default;
      opacity: 0.72;
    }
    .documents-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
      padding: 2px;
      border-radius: 8px;
      background: #091e420f;
    }
    .documents-tab {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #44546f;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      min-width: 0;
      padding: 5px 4px;
      text-align: center;
    }
    .documents-tab[aria-selected="true"] {
      background: #ffffff;
      color: #172b4d;
      box-shadow: 0 1px 2px #091e4224;
    }
    .document-list {
      display: grid;
      gap: 4px;
    }
    .document-row {
      display: grid;
      grid-template-columns: 12px minmax(74px, auto) 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      color: #172b4d;
      text-decoration: none;
    }
    .document-row:hover {
      background: #091e420f;
    }
    .document-row .tag-open-icon {
      opacity: 0;
      transform: translate(-2px, 2px);
    }
    .document-row:hover .tag-open-icon,
    .document-row:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .document-number {
      color: #0c66a1;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .document-meta {
      display: flex;
      min-width: 0;
      gap: 4px;
      flex-wrap: wrap;
    }
    .document-pill {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      background: #091e420f;
      color: #44546f;
      white-space: nowrap;
    }
    .document-pill.served { background: #dcfff1; color: #216e4e; }
    .document-pill.partial { background: #fff7d6; color: #7f5f01; }
    .document-pill.pending { background: #f1f2f4; color: #44546f; }
    .document-pill.review { background: #fff7d6; color: #7f5f01; }
    .document-pill.cancelled,
    .document-pill.failed { background: #ffebe6; color: #ae2e24; }
    .document-date {
      color: #44546f;
      font-size: 12px;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .documents-note {
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
      padding: 2px 0;
    }
    .documents-other {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #091e4224;
    }
    .documents-other-button {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #44546f;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      padding: 5px 6px;
      text-align: left;
    }
    .documents-other-button:hover {
      background: #091e420f;
      color: #172b4d;
    }
    .documents-other-button:focus-visible {
      outline: 2px solid #388bff;
      outline-offset: 2px;
    }
    .documents-other-count {
      color: #626f86;
      font-weight: 500;
      white-space: nowrap;
    }
    .documents-other-list {
      margin-top: 4px;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { color: #b6c2cf; }
      .section-label { color: #a9abaf; }
      .tag-contact {
        background: rgba(0, 121, 191, 0.2);
        color: #579dff;
      }
      .tag-project {
        background: rgba(27, 119, 66, 0.2);
        color: #4bce97;
      }
      .tag-contact .tag-icon { fill: #579dff; }
      .tag-project .tag-icon { fill: #4bce97; }
      .tag-close-icon { fill: currentColor; }
      .tag-address { color: #8c9bab; }
      .empty { color: #8c9bab; }
      .important-message {
        background: rgba(245, 205, 71, 0.14);
        color: #f5cd47;
        border-left-color: #f5cd47;
      }
      .documents { border-top-color: #a6c5e229; }
      .documents-count,
      .documents-hint,
      .document-date,
      .documents-note,
      .documents-other-count { color: #8c9bab; }
      .documents-button { background: #a6c5e229; color: #b6c2cf; }
      .documents-button:hover { background: #a6c5e23d; }
      .documents-tabs { background: #a6c5e229; }
      .documents-tab { color: #8c9bab; }
      .documents-tab[aria-selected="true"] {
        background: #1d2125;
        color: #b6c2cf;
        box-shadow: 0 1px 2px #030404;
      }
      .document-row { color: #b6c2cf; }
      .document-row:hover { background: #a6c5e229; }
      .document-number { color: #579dff; }
      .document-pill { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.served { background: rgba(75, 206, 151, 0.16); color: #4bce97; }
      .document-pill.partial { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.pending { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.review { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.cancelled,
      .document-pill.failed { background: rgba(248, 113, 104, 0.16); color: #f87168; }
      .documents-other { border-top-color: #a6c5e229; }
      .documents-other-button { color: #8c9bab; }
      .documents-other-button:hover {
        background: #a6c5e229;
        color: #b6c2cf;
      }
    }
  </style>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="content"></div>
  <script>
    var HOLDED_CONTACT_URL = 'https://app.holded.com/contacts/';
    var HOLDED_PROJECT_URL = 'https://app.holded.com/projects/p/';
    var HOLDED_PROXY_URL = 'https://holded-proxy.electricaferrer.workers.dev';

    var CONTACT_SVG = '<svg class="tag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M384 48c8.8 0 16 7.2 16 16l0 384c0 8.8-7.2 16-16 16L96 464c-8.8 0-16-7.2-16-16L80 64c0-8.8 7.2-16 16-16l288 0zM96 0C60.7 0 32 28.7 32 64l0 384c0 35.3 28.7 64 64 64l288 0c35.3 0 64-28.7 64-64l0-384c0-35.3-28.7-64-64-64L96 0zM240 248a56 56 0 1 0 0-112 56 56 0 1 0 0 112zm-32 40c-44.2 0-80 35.8-80 80 0 8.8 7.2 16 16 16l192 0c8.8 0 16-7.2 16-16 0-44.2-35.8-80-80-80l-64 0zM512 80c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64zM496 192c-8.8 0-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64c0-8.8-7.2-16-16-16zm16 144c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64z"/></svg>';

    var PROJECT_SVG = '<svg class="tag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M384 80c8.8 0 16 7.2 16 16l0 64c0 8.8-7.2 16-16 16L64 176c-8.8 0-16-7.2-16-16l0-64c0-8.8 7.2-16 16-16l320 0zM64 32C28.7 32 0 60.7 0 96l0 64c0 35.3 28.7 64 64 64l8 0 0 96c0 48.6 39.4 88 88 88l32 0 0 8c0 35.3 28.7 64 64 64l128 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64l-128 0c-35.3 0-64 28.7-64 64l0 8-32 0c-22.1 0-40-17.9-40-40l0-96 264 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64L64 32zM384 336c8.8 0 16 7.2 16 16l0 64c0 8.8-7.2 16-16 16l-128 0c-8.8 0-16-7.2-16-16l0-64c0-8.8 7.2-16 16-16l128 0z"/></svg>';

    var CLOSE_SVG = '<svg class="tag-close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>';

    var OPEN_LINK_SVG = '<svg class="tag-open-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M320 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l82.7 0L201.4 265.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L448 109.3l0 82.7c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160c0-17.7-14.3-32-32-32L320 0zM80 32C35.8 32 0 67.8 0 112l0 320c0 44.2 35.8 80 80 80l320 0c44.2 0 80-35.8 80-80l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 112c0 8.8-7.2 16-16 16L80 448c-8.8 0-16-7.2-16-16l0-320c0-8.8 7.2-16 16-16l112 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L80 32z"/></svg>';

    // NOTE: This file is in public/ (no Vite processing). Keep in sync with VITE_TRELLO_APP_KEY in .env
    var TRELLO_API_KEY = '81d86f6c21c827e54947d36746561233';
    var TAG_REGEXES = {
      contact: /\{\{\s*contact:\s*[^}]*\}\}/g,
      project: /\{\{\s*project:\s*[^}]*\}\}/g,
    };

    function removeDescTag(desc, type) {
      return desc.replace(TAG_REGEXES[type], '').replace(/\n{3,}/g, '\n\n').trim();
    }

    function removeTagFromDescription(field) {
      t.card('id', 'desc').then(function(card) {
        var newDesc = removeDescTag(card.desc || '', field);
        if (newDesc === (card.desc || '').trim()) return;
        var restApi = t.getRestApi();
        restApi.getToken().then(function(token) {
          if (!token) return;
          fetch('https://api.trello.com/1/cards/' + card.id + '?key=' + TRELLO_API_KEY + '&token=' + token, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ desc: newDesc }),
          });
        });
      }).catch(function() {});
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(char) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char];
      });
    }

    function extractTrelloCustomField(customFields) {
      if (!Array.isArray(customFields)) return '';

      var values = [];
      for (var i = 0; i < customFields.length; i++) {
        var field = customFields[i];
        if (!field || typeof field !== 'object') continue;

        var key = String(field.field || field.key || field.name || '').trim().toLowerCase();
        if (key !== 'trello') continue;

        var value = field.value;
        if (Array.isArray(value)) {
          value = value.map(function(item) { return String(item || '').trim(); }).filter(Boolean).join(', ');
        } else if (value && typeof value === 'object') {
          value = JSON.stringify(value);
        } else {
          value = String(value || '').trim();
        }

        if (value) values.push(value);
      }

      return values.join('\n');
    }

    function renderImportantMessage(message) {
      if (!message) return '';
      return '<div class="important-message">' +
        '<span class="important-label">Importante</span> ' +
        '<span class="important-body">' + escapeHtml(message) + '</span>' +
      '</div>';
    }

    function setImportantMessage(contactId, message) {
      var container = document.getElementById('important-message');
      if (!container || container.getAttribute('data-contact-id') !== contactId) return;

      container.innerHTML = renderImportantMessage(message);
      t.sizeTo(contentDiv).catch(function() {});
    }

    function getStatusLabel(status) {
      return ({
        pending: 'Pendiente',
        completed: 'Completado',
        partial: 'Parcial',
        cancelled: 'Cancelado',
        failed: 'Fallido',
        overdue: 'Vencido'
      })[status] || status || 'Sin estado';
    }

    function getStatusClass(status) {
      if (status === 'completed') return 'served';
      if (status === 'partial') return 'partial';
      if (status === 'cancelled' || status === 'failed') return status;
      return 'pending';
    }

    function getNumberValue(value) {
      var number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function getSalesOrderShipmentPill(documentItem) {
      var tracking = documentItem.shippedItems;
      if (!tracking || tracking.error) return { label: 'Sin datos envío', className: 'review' };

      var items = Array.isArray(tracking.items) ? tracking.items : [];
      var sent = 0;
      var pending = 0;
      var total = 0;

      for (var i = 0; i < items.length; i++) {
        sent += getNumberValue(items[i].sent);
        pending += getNumberValue(items[i].pending);
        total += getNumberValue(items[i].total);
      }

      if (pending <= 0 && sent !== 0) return { label: 'Preparado', className: 'served' };
      if (sent === 0 && pending > 0) return { label: 'Pendiente', className: 'pending' };
      if (sent > 0 && pending > 0) return { label: 'Parcial', className: 'partial' };
      return { label: 'Pendiente', className: 'pending' };
    }

    function getWaybillStatusPill(status) {
      if (status === 'completed') return { label: 'Aceptado', className: 'served' };
      if (status === 'pending') return { label: 'Pendiente', className: 'pending' };
      if (status === 'cancelled' || status === 'failed') return { label: getStatusLabel(status), className: status };
      return { label: getStatusLabel(status), className: getStatusClass(status) };
    }

    function getEstimateStatusPill(status) {
      if (status === 'completed') return { label: 'Aceptado', className: 'served' };
      if (status === 'cancelled') return { label: 'Denegado', className: 'cancelled' };
      return { label: getStatusLabel(status), className: getStatusClass(status) };
    }

    function getDocumentPills(documentItem) {
      if (documentItem.type === 'sales-orders') return [getSalesOrderShipmentPill(documentItem)];
      if (documentItem.type === 'waybills') return [getWaybillStatusPill(documentItem.status)];
      if (documentItem.type === 'estimates') return [getEstimateStatusPill(documentItem.status)];
      return [{ label: getStatusLabel(documentItem.status), className: getStatusClass(documentItem.status) }];
    }

    var DOCUMENT_TABS = [
      { key: 'salesOrders', label: 'Pedidos venta', empty: 'No hay pedidos de venta para este cliente.' },
      { key: 'waybills', label: 'Albaranes', empty: 'No hay albaranes para este cliente.' },
      { key: 'estimates', label: 'Presupuestos', empty: 'No hay presupuestos para este cliente.' },
    ];
    var documentsCache = {};

    function getDocumentsCacheKey(data) {
      return (data.contactId || '') + '|' + (data.projectId || '');
    }

    function formatDateLabel(value) {
      if (!value) return '';
      var text = String(value);
      var dateOnly = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (dateOnly) return dateOnly[3] + '/' + dateOnly[2] + '/' + dateOnly[1];

      var date = new Date(text);
      if (Number.isNaN(date.getTime())) return text;
      return date.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
      });
    }

    function getDocumentNumber(documentItem) {
      var fallback = documentItem.type === 'sales-orders' ? 'PV ' :
        documentItem.type === 'purchase-orders' ? 'PC ' :
        documentItem.type === 'estimates' ? 'PRE ' : 'ALB ';
      return documentItem.documentNumber || (fallback + documentItem.id.slice(-6));
    }

    function getDocumentDateText(documentItem) {
      if (documentItem.updatedAt) return 'Actualizado ' + formatDateLabel(documentItem.updatedAt);
      if (documentItem.date) return 'Creado ' + formatDateLabel(documentItem.date);
      return 'Sin fecha';
    }

    function renderDocumentRows(items, tab) {
      if (!items || items.length === 0) {
        return '<div class="documents-note">' + tab.empty + '</div>';
      }

      return '<div class="document-list">' + items.map(function(documentItem) {
        var number = getDocumentNumber(documentItem);
        var url = documentItem.url || '#';
        var pills = getDocumentPills(documentItem).map(function(pill) {
          return '<span class="document-pill ' + pill.className + '">' + escapeHtml(pill.label) + '</span>';
        }).join('');

        return '<a class="document-row" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
          OPEN_LINK_SVG +
          '<span class="document-number">#' + escapeHtml(number) + '</span>' +
          '<span class="document-meta">' +
            pills +
          '</span>' +
          '<span class="document-date">' + escapeHtml(getDocumentDateText(documentItem)) + '</span>' +
        '</a>';
      }).join('') + '</div>';
    }

    function renderOtherDocuments(otherItems, tab, showOther) {
      if (!otherItems || otherItems.length === 0) return '';

      return '<div class="documents-other">' +
        '<button type="button" class="documents-other-button" data-show-other="' + tab.key + '" aria-expanded="' + (showOther ? 'true' : 'false') + '">' +
          '<span>' + (showOther ? 'Ocultar otros sin proyecto' : 'Ver otros sin proyecto') + '</span>' +
          '<span class="documents-other-count">' + otherItems.length + '</span>' +
        '</button>' +
        (showOther ? '<div class="documents-other-list">' + renderDocumentRows(otherItems, tab) + '</div>' : '') +
      '</div>';
    }

    function renderDocumentsPanel(data, result, activeKey, showOther) {
      var container = document.getElementById('documents');
      if (!container ||
        container.getAttribute('data-contact-id') !== (data.contactId || '') ||
        container.getAttribute('data-project-id') !== (data.projectId || '')) return;

      activeKey = activeKey || 'salesOrders';
      var results = result.results || {};
      var otherResults = results.other || result.other || {};
      var activeTab = DOCUMENT_TABS.find(function(tab) { return tab.key === activeKey; }) || DOCUMENT_TABS[0];
      showOther = !!showOther;

      var tabs = DOCUMENT_TABS.map(function(tab) {
        var count = Array.isArray(results[tab.key]) ? results[tab.key].length : 0;
        return '<button type="button" class="documents-tab" data-tab="' + tab.key + '" aria-selected="' + (tab.key === activeTab.key ? 'true' : 'false') + '">' +
          escapeHtml(tab.label) + ' ' + count +
        '</button>';
      }).join('');

      var visibleCount = DOCUMENT_TABS.reduce(function(total, tab) {
        return total + (Array.isArray(results[tab.key]) ? results[tab.key].length : 0);
      }, 0);

      container.innerHTML =
        '<div class="documents-header">' +
          '<div class="section-label">Documentos Holded</div>' +
          '<div class="documents-count">' + visibleCount + '</div>' +
        '</div>' +
        '<div class="documents-tabs" role="tablist">' + tabs + '</div>' +
        renderDocumentRows(results[activeTab.key] || [], activeTab) +
        renderOtherDocuments(otherResults[activeTab.key] || [], activeTab, showOther);

      var buttons = container.querySelectorAll('.documents-tab');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener('click', function() {
          renderDocumentsPanel(data, result, this.getAttribute('data-tab') || 'salesOrders');
        });
      }

      var otherButton = container.querySelector('.documents-other-button');
      if (otherButton) {
        otherButton.addEventListener('click', function() {
          renderDocumentsPanel(data, result, this.getAttribute('data-show-other') || activeTab.key, !showOther);
        });
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function renderDocumentsCollapsed(data) {
      var container = document.getElementById('documents');
      if (!container) return;

      var cacheKey = getDocumentsCacheKey(data);
      if (documentsCache[cacheKey]) {
        renderDocumentsPanel(data, documentsCache[cacheKey], 'salesOrders');
        return;
      }

      var hint = data.projectId
        ? 'Filtrados por cliente y proyecto'
        : 'Documentos del cliente vinculado';

      container.innerHTML =
        '<div class="documents-summary">' +
          '<div>' +
            '<div class="section-label">Documentos Holded</div>' +
            '<div class="documents-hint">' + hint + '</div>' +
          '</div>' +
          '<button type="button" class="documents-button" id="load-documents">Cargar documentos</button>' +
        '</div>';

      var button = document.getElementById('load-documents');
      if (button) {
        button.addEventListener('click', function() {
          refreshDocuments(data);
        });
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function refreshDocuments(data) {
      if (!data.contactId) return;

      var container = document.getElementById('documents');
      if (!container) return;
      container.innerHTML =
        '<div class="documents-summary">' +
          '<div>' +
            '<div class="section-label">Documentos Holded</div>' +
            '<div class="documents-note">Cargando documentos...</div>' +
          '</div>' +
          '<button type="button" class="documents-button" disabled>Cargar documentos</button>' +
        '</div>';

      var params = new URLSearchParams({ contactId: data.contactId });
      if (data.projectId) params.set('projectId', data.projectId);

      fetch(HOLDED_PROXY_URL + '/documents/search?' + params.toString())
        .then(function(response) {
          if (!response.ok) throw new Error('Holded API error: ' + response.status);
          return response.json();
        })
        .then(function(result) {
          documentsCache[getDocumentsCacheKey(data)] = result;
          renderDocumentsPanel(data, result, 'salesOrders');
        })
        .catch(function(err) {
          console.warn('Holded: error loading documents', err);
          if (container.getAttribute('data-contact-id') === (data.contactId || '') &&
            container.getAttribute('data-project-id') === (data.projectId || '')) {
            container.innerHTML =
              '<div class="documents-header">' +
                '<div class="section-label">Documentos Holded</div>' +
              '</div>' +
              '<div class="documents-note">No se pudieron cargar los documentos.</div>';
            t.sizeTo(contentDiv).catch(function() {});
          }
        });
    }

    function refreshTrelloMessage(data) {
      if (!data.contactId) return;
      var contactId = data.contactId;

      fetch(HOLDED_PROXY_URL + '/api/v2/contacts/' + encodeURIComponent(contactId))
        .then(function(response) {
          if (!response.ok) throw new Error('Holded API error: ' + response.status);
          return response.json();
        })
        .then(function(contact) {
          setImportantMessage(contactId, extractTrelloCustomField(contact.customFields || contact.custom_fields));
        })
        .catch(function(err) {
          console.warn('Holded: error loading Trello custom field', err);
        });
    }

    var contentDiv = document.getElementById('content');
    // NOTE: Keep appKey in sync with VITE_TRELLO_APP_KEY in .env
    var t = window.TrelloPowerUp.iframe({ appKey: '81d86f6c21c827e54947d36746561233', appName: 'Holded' });

    function render() {
      t.get('card', 'shared', 'holdedData')
        .then(function(data) {
          data = data || {};
          var tags = [];

          if (data.contactName) {
            var href = data.contactId ? HOLDED_CONTACT_URL + data.contactId : '#';
            var target = data.contactId ? ' target="_blank"' : '';
            var addrHtml = '';
            if (data.addressLabel) {
              addrHtml = ' <span class="tag-address" title="' + escapeHtml(data.addressLabel) + '">| ' + escapeHtml(data.addressLabel) + '</span>';
            }
            tags.push(
              '<a class="tag tag-contact" href="' + escapeHtml(href) + '"' + target + '>' +
                CONTACT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.contactName) + addrHtml + '</span>' +
                '<span class="tag-close" data-field="contact">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          }

          if (data.projectName) {
            var href = data.projectId ? HOLDED_PROJECT_URL + data.projectId : '#';
            var target = data.projectId ? ' target="_blank"' : '';
            tags.push(
              '<a class="tag tag-project" href="' + escapeHtml(href) + '"' + target + '>' +
                PROJECT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.projectName) + '</span>' +
                '<span class="tag-close" data-field="project">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          }

          if (tags.length === 0) {
            contentDiv.innerHTML = '<div class="empty">No hay datos vinculados.</div>';
          } else {
            var documentsHtml = data.contactId
              ? '<div id="documents" class="documents" data-contact-id="' + escapeHtml(data.contactId || '') + '" data-project-id="' + escapeHtml(data.projectId || '') + '"></div>'
              : '';
            contentDiv.innerHTML =
              '<div class="tags">' + tags.join('') + '</div>' +
              '<div id="important-message" data-contact-id="' + escapeHtml(data.contactId || '') + '"></div>' +
              documentsHtml;
          }

          var closeBtns = contentDiv.querySelectorAll('.tag-close');
          for (var i = 0; i < closeBtns.length; i++) {
            closeBtns[i].addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              var field = this.getAttribute('data-field');
              var label = field === 'contact' ? 'cliente' : 'proyecto';
              if (!confirm('¿Desvincular ' + label + '?')) return;
              t.get('card', 'shared', 'holdedData').then(function(current) {
                current = current || {};
                if (field === 'contact') {
                  delete current.contactId;
                  delete current.contactName;
                  delete current.addressLabel;
                } else {
                  delete current.projectId;
                  delete current.projectName;
                }
                t.set('card', 'shared', 'holdedData', current).then(function() {
                  removeTagFromDescription(field);
                  render();
                });
              });
            });
          }

          refreshTrelloMessage(data);
          if (data.contactId) renderDocumentsCollapsed(data);
          t.sizeTo(contentDiv).catch(function() {});
        })
        .catch(function(err) {
          contentDiv.innerHTML = '<div style="color:red;padding:8px;font-size:12px;">Error: ' + err.message + '</div>';
        });
    }

    render();
    t.render(function() {
      render();
    });
  </script>
</body>
</html>
