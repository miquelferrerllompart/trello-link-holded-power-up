<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holded Info</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #172b4d;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      color: #44546f;
      margin-bottom: 6px;
    }
    .tags {
      display: grid;
      gap: 6px;
    }
    .tag {
      display: grid;
      grid-template-columns: 16px 12px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      max-width: 100%;
      line-height: 20px;
      transition: background 0.15s, color 0.15s;
    }
    .tag-contact {
      background: #e4f0f6;
      color: #0c66a1;
    }
    .tag-project {
      background: #e6f4ea;
      color: #1b7742;
    }
    .tag-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .tag-open-icon {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity 0.15s, transform 0.15s;
      fill: currentColor;
    }
    .tag:hover .tag-open-icon,
    .tag:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tag:hover .tag-name,
    .tag:focus-visible .tag-name {
      overflow: visible;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .tag-address {
      color: #5e6c84;
      font-weight: 400;
      font-size: 12px;
      cursor: help;
      white-space: nowrap;
    }
    .tag-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .tag:hover .tag-close,
    .tag:focus-within .tag-close {
      opacity: 1;
    }
    .tag-close-icon {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }
    .tag-add {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px dashed #8590a2;
      border-radius: 8px;
      background: transparent;
      color: #626f86;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s ease-out;
    }
    .tag-add:hover { background: #091e420f; border-color: #626f86; color: #172b4d; }
    .tag-add:active { transform: scale(0.98); }
    .tag-add:focus-visible { outline: 2px solid #388bff; outline-offset: 2px; }
    .tag-add .tag-icon { flex-shrink: 0; fill: currentColor; }
    .empty {
      color: #6b778c;
      font-size: 13px;
      padding: 4px 0;
    }
    .important-message {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid #f5cd47;
      border-radius: 6px;
      background: #fff7d6;
      color: #7f5f01;
      font-size: 13px;
      line-height: 18px;
      white-space: pre-line;
    }
    .important-label {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .documents {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #091e4224;
    }
    .documents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .documents-count {
      color: #626f86;
      font-size: 11px;
      line-height: 14px;
    }
    .documents-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .documents-hint {
      min-width: 0;
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
    }
    .documents-button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: #091e420f;
      color: #172b4d;
      cursor: pointer;
      flex: 0 0 auto;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      padding: 6px 10px;
    }
    .documents-button:hover {
      background: #091e4224;
    }
    .documents-button:focus-visible,
    .documents-tab:focus-visible,
    .documents-scope-button:focus-visible,
    .documents-page-button:focus-visible,
    .document-row:focus-visible {
      outline: 2px solid #388bff;
      outline-offset: 2px;
    }
    .documents-button[disabled] {
      cursor: default;
      opacity: 0.72;
    }
    .documents-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
      padding: 2px;
      border-radius: 8px;
      background: #091e420f;
    }
    .documents-tab {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #44546f;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      min-width: 0;
      padding: 5px 4px;
      text-align: center;
    }
    .documents-tab[aria-selected="true"] {
      background: #ffffff;
      color: #172b4d;
      box-shadow: 0 1px 2px #091e4224;
    }
    .documents-scope-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 2px 8px;
    }
    .documents-context {
      color: #626f86;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      white-space: nowrap;
    }
    .documents-scope {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      padding: 2px;
      border: 1px solid #091e4224;
      border-radius: 7px;
      background: #ffffff;
    }
    .documents-scope-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #626f86;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      padding: 4px 7px;
      white-space: nowrap;
    }
    .documents-scope-button:hover {
      background: #091e420f;
      color: #172b4d;
    }
    .documents-scope-button[aria-pressed="true"] {
      background: #e9f2ff;
      color: #0c66a1;
    }
    .documents-scope-count {
      min-width: 14px;
      border-radius: 999px;
      background: #091e420f;
      color: inherit;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 14px;
      padding: 0 4px;
      text-align: center;
    }
    .documents-scope-button[aria-pressed="true"] .documents-scope-count {
      background: #ffffffb8;
    }
    .document-list {
      display: grid;
      gap: 4px;
    }
    .document-row {
      display: grid;
      grid-template-columns: 12px minmax(74px, auto) 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      color: #172b4d;
      text-decoration: none;
    }
    .document-row:hover {
      background: #091e420f;
    }
    .document-row .tag-open-icon {
      opacity: 0;
      transform: translate(-2px, 2px);
    }
    .document-row:hover .tag-open-icon,
    .document-row:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .document-number {
      color: #0c66a1;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .document-meta {
      display: flex;
      min-width: 0;
      gap: 4px;
      flex-wrap: wrap;
    }
    .document-pill {
      display: inline-block;
      max-width: 100%;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      background: #091e420f;
      color: #44546f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }
    .document-pill.done { background: #dcfff1; color: #216e4e; }
    .document-pill.partial { background: #fff7d6; color: #7f5f01; }
    .document-pill.pending { background: #f1f2f4; color: #44546f; }
    .document-pill.review { background: #fff7d6; color: #7f5f01; }
    .document-pill.cancelled,
    .document-pill.failed { background: #ffebe6; color: #ae2e24; }
    .document-project-chip {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 1px 6px;
      border-radius: 999px;
      background: #091e420f;
      color: #626f86;
      font-size: 10px;
      font-weight: 600;
      line-height: 16px;
    }
    .document-amounts {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      min-width: 0;
      color: #44546f;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
      white-space: nowrap;
    }
    .document-total { font-weight: 700; }
    .document-pending-amount { color: #7f5f01; }
    /* Relation rail — purchase orders render as tree children of their sales order. */
    .relation-rail {
      display: grid;
      gap: 3px;
      margin: 1px 0 3px 6px;
      padding-left: 12px;
      border-left: 2px solid #dcd6f7;
    }
    .purchase-order-row {
      position: relative;
      display: grid;
      grid-template-columns: 10px minmax(58px, auto) 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 4px;
      border-radius: 6px;
      color: #5e4db2;
      text-decoration: none;
    }
    .purchase-order-row::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      width: 10px;
      height: 2px;
      background: #dcd6f7;
    }
    .purchase-order-row:hover { background: #f3f0ff; }
    .purchase-order-row .tag-open-icon { opacity: 0; transform: translate(-2px, 2px); }
    .purchase-order-row:hover .tag-open-icon,
    .purchase-order-row:focus-visible .tag-open-icon { opacity: 1; transform: translate(0, 0); }
    .purchase-order-number {
      color: #5e4db2;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .purchase-order-supplier {
      min-width: 0;
      color: #6b778c;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .documents-button:active,
    .documents-scope-button:active,
    .documents-page-button:active:not([disabled]) {
      transform: scale(0.97);
    }
    .documents-button,
    .documents-scope-button,
    .documents-page-button {
      transition: background 0.15s, color 0.15s, transform 0.1s ease-out;
    }
    .document-date {
      color: #44546f;
      font-size: 12px;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .documents-note {
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
      padding: 2px 0;
    }
    .documents-loading-label {
      color: #626f86;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      margin: 2px 8px 5px;
    }
    .documents-skeleton {
      display: grid;
      gap: 4px;
    }
    .documents-skeleton-row {
      position: relative;
      height: 30px;
      overflow: hidden;
      border-radius: 6px;
      background: #091e420f;
    }
    .documents-skeleton-row::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, #ffffff8f 48%, transparent 100%);
      content: '';
      transform: translateX(-100%);
      animation: documents-loading-sweep 1.35s ease-in-out infinite;
    }
    @keyframes documents-loading-sweep {
      to { transform: translateX(100%); }
    }
    .documents-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-top: 6px;
    }
    .documents-page-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .documents-page-button {
      appearance: none;
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: #091e420f;
      color: #172b4d;
      cursor: pointer;
      font: inherit;
      font-size: 20px;
      line-height: 20px;
      padding: 0 0 2px;
    }
    .documents-page-button:hover:not([disabled]) {
      background: #091e4224;
    }
    .documents-page-button[disabled] {
      cursor: default;
      opacity: 0.35;
    }
    .documents-page-label {
      min-width: 84px;
      color: #626f86;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
      text-align: center;
    }
    .documents-range {
      color: #626f86;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
      white-space: nowrap;
    }
    .documents-page-label strong {
      color: #172b4d;
      font-weight: 700;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { color: #b6c2cf; }
      .section-label { color: #a9abaf; }
      .tag-contact {
        background: rgba(0, 121, 191, 0.2);
        color: #579dff;
      }
      .tag-project {
        background: rgba(27, 119, 66, 0.2);
        color: #4bce97;
      }
      .tag-contact .tag-icon { fill: #579dff; }
      .tag-project .tag-icon { fill: #4bce97; }
      .tag-close-icon { fill: currentColor; }
      .tag-address { color: #8c9bab; }
      .tag-add { border-color: #5b6979; color: #8c9bab; }
      .tag-add:hover { background: #a6c5e229; border-color: #8c9bab; color: #b6c2cf; }
      .empty { color: #8c9bab; }
      .important-message {
        background: rgba(245, 205, 71, 0.14);
        color: #f5cd47;
        border-left-color: #f5cd47;
      }
      .documents { border-top-color: #a6c5e229; }
      .documents-count,
      .documents-hint,
      .document-date,
      .documents-note,
      .documents-loading-label,
      .documents-range,
      .documents-page-label { color: #8c9bab; }
      .documents-button { background: #a6c5e229; color: #b6c2cf; }
      .documents-button:hover { background: #a6c5e23d; }
      .documents-tabs { background: #a6c5e229; }
      .documents-tab { color: #8c9bab; }
      .documents-tab[aria-selected="true"] {
        background: #1d2125;
        color: #b6c2cf;
        box-shadow: 0 1px 2px #030404;
      }
      .documents-context { color: #8c9bab; }
      .documents-scope { background: #1d2125; border-color: #a6c5e229; }
      .documents-scope-button { color: #8c9bab; }
      .documents-scope-button:hover { background: #a6c5e229; color: #b6c2cf; }
      .documents-scope-button[aria-pressed="true"] { background: #1c2b41; color: #579dff; }
      .documents-scope-count { background: #a6c5e229; }
      .documents-scope-button[aria-pressed="true"] .documents-scope-count { background: #579dff24; }
      .document-row { color: #b6c2cf; }
      .document-row:hover { background: #a6c5e229; }
      .document-number { color: #579dff; }
      .document-pill { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.done { background: rgba(75, 206, 151, 0.16); color: #4bce97; }
      .document-pill.partial { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.pending { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.review { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.cancelled,
      .document-pill.failed { background: rgba(248, 113, 104, 0.16); color: #f87168; }
      .document-project-chip { background: #a1bdd914; color: #8c9bab; }
      .document-amounts { color: #b6c2cf; }
      .document-pending-amount { color: #f5cd47; }
      .relation-rail { border-left-color: #454168; }
      .purchase-order-row { color: #b8acf6; }
      .purchase-order-row::before { background: #454168; }
      .purchase-order-row:hover { background: rgba(159, 143, 239, 0.16); }
      .purchase-order-number { color: #b8acf6; }
      .purchase-order-supplier { color: #8c9bab; }
      .documents-page-button { background: #a6c5e229; color: #b6c2cf; }
      .documents-page-button:hover:not([disabled]) { background: #a6c5e23d; }
      .documents-page-label strong { color: #b6c2cf; }
      .documents-skeleton-row { background: #a6c5e214; }
      .documents-skeleton-row::after { background: linear-gradient(90deg, transparent 0%, #a6c5e21f 48%, transparent 100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .documents-skeleton-row::after { animation: none; }
    }
    @media (max-width: 480px) {
      .documents-scope-row {
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }
      .documents-context { margin-left: 5px; }
      .documents-scope {
        box-sizing: border-box;
        width: 100%;
      }
      .documents-scope-button {
        flex: 1 1 0;
        justify-content: center;
      }
      .document-row {
        grid-template-columns: 12px minmax(0, 1fr) auto;
      }
      .document-meta {
        grid-column: 2 / 4;
        grid-row: 2;
      }
      .document-date {
        grid-column: 3;
        grid-row: 1;
      }
      .documents-skeleton-row { height: 48px; }
    }
  </style>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

  <div id="content"></div>
  <script>
    var HOLDED_CONTACT_URL = 'https://app.holded.com/contacts/';
    var HOLDED_PROJECT_URL = 'https://app.holded.com/projects/p/';
    var HOLDED_PROXY_URL = 'https://holded-proxy.electricaferrer.workers.dev';

    // Unlinking (clearing storage + removing the description tag) runs in the

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(char) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char];
      });

    function extractTrelloCustomField(customFields) {
      if (!Array.isArray(customFields)) return '';

      var values = [];
      for (var i = 0; i < customFields.length; i++) {
        var field = customFields[i];
        if (!field || typeof field !== 'object') continue;

        var key = String(field.field || field.key || field.name || '').trim().toLowerCase();
        if (key !== 'trello') continue;

        var value = field.value;
        if (Array.isArray(value)) {
          value = value.map(function(item) { return String(item || '').trim(); }).filter(Boolean).join(', ');
        } else if (value && typeof value === 'object') {
          value = JSON.stringify(value);
        } else {
          value = String(value || '').trim();
        }

        if (value) values.push(value);
      }

      return values.join('\n');
    }

    // Status pills mirror src/sales-order-display.ts. Every field read below is a

    var ESTIMATE_STATUS = {

    var INVOICE_STATUS = {

      partially_received: { label: 'Parcialmente recibido', className: 'partial' },

    function statusFromMap(map, value) {

    function getDocumentPill(documentItem) {

    var DOCUMENT_TABS = [
      { key: 'salesOrders', type: 'sales-orders', label: 'Pedidos venta', loadingLabel: 'pedidos de venta', emptyAll: 'Este cliente no tiene pedidos de venta.', emptyProject: 'No hay pedidos de venta en el proyecto vinculado.' },
      { key: 'waybills', type: 'waybills', label: 'Albaranes', loadingLabel: 'albaranes', emptyAll: 'Este cliente no tiene albaranes.', emptyProject: 'No hay albaranes en el proyecto vinculado.' },
      { key: 'invoices', type: 'invoices', label: 'Facturas', loadingLabel: 'facturas', emptyAll: 'Este cliente no tiene facturas.', emptyProject: 'No hay facturas en el proyecto vinculado.' },
      { key: 'estimates', type: 'estimates', label: 'Presupuestos', loadingLabel: 'presupuestos', emptyAll: 'Este cliente no tiene presupuestos.', emptyProject: 'No hay presupuestos en el proyecto vinculado.' },
    ];
    var DOCUMENT_PAGE_SIZE = 10;
    var documentsCache = {};

    function getDocumentsViewKey(data) {

    function getDocumentsView(data) {
      var key = getDocumentsViewKey(data);
      if (!documentViews[key]) {
        documentViews[key] = {
          expanded: true,
          activeKey: 'salesOrders',
          scope: 'matched',
          pages: {},   // stateKey -> current page number
          cursors: {}, // stateKey -> { pageNumber: cursorToFetchThatPage } (estimates)

    function getDocumentTab(key) {

    function getDocumentsStateKey(scope, tab) {

    function getDocumentsPageKey(data, tab, scope, page) {

    function formatDateLabel(value) {
      if (!value) return '';
      var text = String(value);
      var dateOnly = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (dateOnly) return dateOnly[3] + '/' + dateOnly[2] + '/' + dateOnly[1];

      var date = new Date(text);
      if (Number.isNaN(date.getTime())) return text;
      return date.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
      });
    }

    function getDocumentNumber(documentItem) {
      var fallback = documentItem.type === 'sales-orders' ? 'PV ' :
        documentItem.type === 'purchase-orders' ? 'PC ' :
        documentItem.type === 'estimates' ? 'PRE ' :
        documentItem.type === 'invoices' ? 'FAC ' : 'ALB ';
      return documentItem.documentNumber || (fallback + documentItem.id.slice(-6));
    }

    function getDocumentDateText(documentItem) {
      if (documentItem.issueDate) return formatDateLabel(documentItem.issueDate);
      return 'Sin fecha';
    }

    function renderPill(pill) {
      return '<span class="document-pill ' + pill.className + '" title="' + escapeHtml(pill.label) + '">' +
        escapeHtml(pill.label) +
      '</span>';
    }

    function formatDecimalAmount(value, currency) {
      var text = String(value == null ? '0' : value).trim();
      var match = text.match(/^(-?)(\d+)(?:\.(\d+))?$/);
      if (!match) return text + (currency ? ' ' + currency : '');

      var integer = match[2].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      var decimals = (match[3] || '').padEnd(2, '0').slice(0, 2);
      var amount = match[1] + integer + ',' + decimals;
      return currency === 'EUR' ? amount + ' €' : amount + (currency ? ' ' + currency : '');
    }

    function hasPositiveAmount(value) {
      return !/^[+-]?0*(?:\.0*)?$/.test(String(value == null ? '0' : value).trim());
    }

    function renderDocumentAmounts(documentItem) {
      var totalValue;
      var pendingValue;
      var currency;

      if (documentItem.type === 'invoices' && documentItem.amounts) {
        totalValue = documentItem.amounts.total;
        pendingValue = documentItem.amounts.pending;
        currency = documentItem.amounts.currency;
      } else if (documentItem.type === 'estimates' && documentItem.total != null) {
        totalValue = documentItem.total;
        currency = documentItem.currency;
      } else {
        return '';
      }

      var total = formatDecimalAmount(totalValue, currency);
      var pending = hasPositiveAmount(pendingValue)
        ? '<span class="document-pending-amount">Pendiente ' + escapeHtml(formatDecimalAmount(pendingValue, currency)) + '</span>'
        : '';
      return '<span class="document-amounts"><span class="document-total">' + escapeHtml(total) + '</span>' + pending + '</span>';
    }

    // In "Todos", a row whose project differs from the linked one carries a muted
    // chip so the old "otros proyectos" information survives the new semantics.
    function renderProjectChip(documentItem, data, scope) {
      if (scope !== 'all' || !data.projectId) return '';
      var projects = documentItem.projects || [];
      var matchesLinked = projects.some(function(project) { return project.id === data.projectId; });
      if (matchesLinked) return '';
      var name = projects.length && projects[0].name ? projects[0].name : '';
      if (!name) return '';
      return '<span class="document-project-chip" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>';
    }

    function renderDocumentRow(documentItem, data, scope) {
      var number = getDocumentNumber(documentItem);

        '<span class="document-number">#' + escapeHtml(number) + '</span>' +
        '<span class="document-meta">' +
          renderPill(getDocumentPill(documentItem)) +

          renderDocumentAmounts(documentItem) +
        '</span>' +
        '<span class="document-date">' + escapeHtml(getDocumentDateText(documentItem)) + '</span>' +
      '</a>';

    function renderPurchaseOrderRow(purchaseOrder) {
      var number = getDocumentNumber(purchaseOrder);
      var url = purchaseOrder.url || '#';
      var supplier = purchaseOrder.supplier && purchaseOrder.supplier.name ? purchaseOrder.supplier.name : '';

        OPEN_LINK_SVG +
        '<span class="purchase-order-number">#' + escapeHtml(number) + '</span>' +
        '<span class="purchase-order-supplier">' + escapeHtml(supplier) + '</span>' +

      '</a>';

    function renderSalesOrderGroup(order, data, scope) {
      var html = renderDocumentRow(order, data, scope);

      if (purchaseOrders.length) {
        html += '<div class="relation-rail">' +

        '</div>';
      }
      return html;
    }

    function renderDocumentRows(result, tab, data, scope) {
      var items = result.results || [];
      if (items.length === 0) {
        var emptyMessage = (data.projectId && scope === 'matched') ? tab.emptyProject : tab.emptyAll;
        return '<div class="documents-note">' + emptyMessage + '</div>';
      }

      var rows = tab.type === 'sales-orders'
        ? items.map(function(order) { return renderSalesOrderGroup(order, data, scope); }).join('')
        : items.map(function(item) { return renderDocumentRow(item, data, scope); }).join('');

      var purchaseOrdersNote = (tab.type === 'sales-orders' && result.purchaseOrdersError)
        ? '<div class="documents-note">No se pudieron cargar las compras.</div>'
        : '';

      return '<div class="document-list">' + rows + '</div>' + purchaseOrdersNote;
    }

    function renderDocumentsLoading(tab) {
      return '<div class="documents-loading" role="status">' +
        '<div class="documents-loading-label">Cargando ' + tab.loadingLabel + '…</div>' +
        '<div class="documents-skeleton" aria-hidden="true">' +
          '<div class="documents-skeleton-row"></div>' +
          '<div class="documents-skeleton-row"></div>' +
          '<div class="documents-skeleton-row"></div>' +
        '</div>' +
      '</div>';
    }

    function renderPagination(result) {
      if (!result) return '';
      var page = result.page || 1;
      var hasPrevious = page > 1;
      var hasNext = !!result.hasMore;
      if (!hasPrevious && !hasNext) return '';

      return '<div class="documents-pagination" role="navigation" aria-label="Paginación de documentos">' +
        '<div class="documents-page-controls">' +
          '<button type="button" class="documents-page-button" data-page="' + (page - 1) + '" aria-label="Página anterior"' + (hasPrevious ? '' : ' disabled') + '>‹</button>' +
          '<span class="documents-page-label">Página <strong>' + page + '</strong></span>' +
          '<button type="button" class="documents-page-button" data-page="' + (page + 1) + '" aria-label="Página siguiente"' + (hasNext ? '' : ' disabled') + '>›</button>' +
        '</div>' +
      '</div>';
    }

    function renderDocumentScope(data, view) {
      if (!data.projectId) {
        return '<div class="documents-context">Este cliente</div>';

      return '<div class="documents-scope-row">' +
        '<span class="documents-context">Este cliente</span>' +

          '<button type="button" class="documents-scope-button" data-document-scope="all" aria-pressed="' + (view.scope === 'all' ? 'true' : 'false') + '">Todos</button>' +
        '</div>' +
      '</div>';
    }

    function ensureDocumentsPage(data, tab, scope, page) {
      var cacheKey = getDocumentsPageKey(data, tab, scope, page);
      if (documentsCache[cacheKey] || documentRequests[cacheKey]) return;

      var view = getDocumentsView(data);
      var stateKey = getDocumentsStateKey(scope, tab);
      var params = new URLSearchParams({ contactId: data.contactId, type: tab.type, scope: scope });
      if (scope === 'matched' && data.projectId) params.set('projectId', data.projectId);

      if (tab.type === 'estimates') {
        var cursor = (view.cursors[stateKey] || {})[page];
        if (cursor) params.set('cursor', cursor);
      } else {
        params.set('page', String(page));
        params.set('pageSize', String(DOCUMENT_PAGE_SIZE));
      }

      documentRequests[cacheKey] = true;
      delete documentErrors[cacheKey];

      fetch(HOLDED_PROXY_URL + '/v2/documents/search?' + params.toString())
        .then(function(response) {
          return response.json()
            .catch(function() { return {}; })
            .then(function(body) { return { ok: response.ok, body: body }; });
        })
        .then(function(res) {
          delete documentRequests[cacheKey];
          if (!res.ok) {
            var code = res.body && res.body.error && res.body.error.code;
            documentErrors[cacheKey] = { code: code === 'DATA_NOT_READY' ? 'DATA_NOT_READY' : 'GENERIC' };
            renderDocumentsPanel(data);
            return;
          }
          var result = res.body;
          // Estimates page cursor-first; stamp the page so pagination can label it.
          if (tab.type === 'estimates') {
            result.page = page;
            if (result.hasMore && result.nextCursor) {
              if (!view.cursors[stateKey]) view.cursors[stateKey] = {};
              view.cursors[stateKey][page + 1] = result.nextCursor;
            }
          }
          documentsCache[cacheKey] = result;
          renderDocumentsPanel(data);
        })
        .catch(function(err) {
          delete documentRequests[cacheKey];
          documentErrors[cacheKey] = { code: 'GENERIC' };
          console.warn('Holded: error loading documents', err);
          renderDocumentsPanel(data);
        });
    }

    function renderDocumentsPanel(data) {
      var container = document.getElementById('documents');
      if (!container ||
        container.getAttribute('data-contact-id') !== (data.contactId || '') ||
        container.getAttribute('data-project-id') !== (data.projectId || '')) return;

      var view = getDocumentsView(data);
      var activeTab = getDocumentTab(view.activeKey);
      var scope = view.scope === 'all' ? 'all' : 'matched';
      var stateKey = getDocumentsStateKey(scope, activeTab);
      var page = view.pages[stateKey] || 1;
      var cacheKey = getDocumentsPageKey(data, activeTab, scope, page);
      var result = documentsCache[cacheKey];
      var errorInfo = documentErrors[cacheKey];
      var content = '';

      if (result) {
        content = renderDocumentRows(result, activeTab, data, scope) + renderPagination(result);
      } else if (errorInfo) {
        var message = errorInfo.code === 'DATA_NOT_READY'
          ? 'Sincronizando datos de Holded… vuelve a intentarlo en un momento.'
          : 'No se pudieron cargar los documentos.';
        content = '<div class="documents-note">' + message + '</div>' +
          '<button type="button" class="documents-button documents-retry">Reintentar</button>';
      } else {
        content = renderDocumentsLoading(activeTab);
      }

      var tabs = DOCUMENT_TABS.map(function(tab) {
        return '<button type="button" role="tab" id="documents-tab-' + tab.key + '" class="documents-tab" data-tab="' + tab.key + '" aria-controls="documents-panel" aria-selected="' + (tab.key === activeTab.key ? 'true' : 'false') + '" tabindex="' + (tab.key === activeTab.key ? '0' : '-1') + '">' +
          escapeHtml(tab.label) +
        '</button>';
      }).join('');

      container.innerHTML =
        '<div class="documents-header">' +
          '<div class="section-label">Documentos Holded</div>' +
        '</div>' +
        '<div class="documents-tabs" role="tablist">' + tabs + '</div>' +
        '<div id="documents-panel" role="tabpanel" aria-labelledby="documents-tab-' + activeTab.key + '" aria-live="polite" aria-busy="' + (!result && !errorInfo ? 'true' : 'false') + '">' +
          renderDocumentScope(data, view) +
          content +
        '</div>';

      var buttons = container.querySelectorAll('.documents-tab');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener('click', function() {
          view.activeKey = this.getAttribute('data-tab') || 'salesOrders';
          view.pendingTabFocus = null;
          renderDocumentsPanel(data);
        });
        buttons[i].addEventListener('keydown', function(event) {
          var currentIndex = DOCUMENT_TABS.findIndex(function(tab) {
            return tab.key === (event.currentTarget.getAttribute('data-tab') || 'salesOrders');
          });
          var targetIndex = currentIndex;

          if (event.key === 'ArrowRight') targetIndex = (currentIndex + 1) % DOCUMENT_TABS.length;
          else if (event.key === 'ArrowLeft') targetIndex = (currentIndex - 1 + DOCUMENT_TABS.length) % DOCUMENT_TABS.length;
          else if (event.key === 'Home') targetIndex = 0;
          else if (event.key === 'End') targetIndex = DOCUMENT_TABS.length - 1;
          else return;

          event.preventDefault();
          view.activeKey = DOCUMENT_TABS[targetIndex].key;
          view.pendingTabFocus = view.activeKey;
          renderDocumentsPanel(data);
        });
      }

      var scopeButtons = container.querySelectorAll('.documents-scope-button');
      for (var scopeIndex = 0; scopeIndex < scopeButtons.length; scopeIndex++) {
        scopeButtons[scopeIndex].addEventListener('click', function() {
          var nextScope = this.getAttribute('data-document-scope') === 'all' ? 'all' : 'matched';
          if (nextScope === view.scope) return;
          view.scope = nextScope;
          // Land on page 1 of the newly selected scope to avoid an out-of-range page.
          view.pages[getDocumentsStateKey(nextScope, activeTab)] = 1;
          renderDocumentsPanel(data);
        });
      }

      var pageButtons = container.querySelectorAll('.documents-page-button:not([disabled])');
      for (var j = 0; j < pageButtons.length; j++) {
        pageButtons[j].addEventListener('click', function() {
          var targetPage = Number(this.getAttribute('data-page')) || 1;
          view.pages[stateKey] = targetPage;
          renderDocumentsPanel(data);
        });
      }

      var retryButton = container.querySelector('.documents-retry');
      if (retryButton) {
        retryButton.addEventListener('click', function() {
          delete documentErrors[cacheKey];
          renderDocumentsPanel(data);
        });
      }

      if (!result && !errorInfo) {
        ensureDocumentsPage(data, activeTab, scope, page);
      }

      if (view.pendingTabFocus) {
        var focusTarget = container.querySelector('[data-tab="' + view.pendingTabFocus + '"]');
        if (focusTarget) focusTarget.focus();
        if (result && view.pendingTabFocus === activeTab.key) view.pendingTabFocus = null;
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function renderDocumentsCollapsed(data) {
      var container = document.getElementById('documents');
      if (!container) return;

      var view = getDocumentsView(data);
      if (view.expanded) {
        renderDocumentsPanel(data);
        return;
      }

      var hint = data.projectId
        ? 'Filtrados por cliente y proyecto'
        : 'Documentos del cliente vinculado';

      container.innerHTML =
        '<div class="documents-summary">' +
          '<div>' +
            '<div class="section-label">Documentos Holded</div>' +
            '<div class="documents-hint">' + hint + '</div>' +
          '</div>' +
          '<button type="button" class="documents-button" id="load-documents">Cargar documentos</button>' +
        '</div>';

      var button = document.getElementById('load-documents');
      if (button) {
        button.addEventListener('click', function() {
          view.expanded = true;
          renderDocumentsPanel(data);
        });
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function refreshTrelloMessage(data) {
      if (!data.contactId) return;
      var contactId = data.contactId;

      fetch(HOLDED_PROXY_URL + '/v2/contacts/' + encodeURIComponent(contactId))
        .then(function(response) {
          if (!response.ok) throw new Error('Holded API error: ' + response.status);
          return response.json();
        })
        .then(function(contact) {
          setImportantMessage(contactId, extractTrelloCustomField(contact.customFields || contact.custom_fields));
        })
        .catch(function(err) {
          console.warn('Holded: error loading Trello custom field', err);
        });
    }

    var contentDiv = document.getElementById('content');
    // NOTE: Keep appKey in sync with VITE_TRELLO_APP_KEY in .env
    var t = window.TrelloPowerUp.iframe({ appKey: '81d86f6c21c827e54947d36746561233', appName: 'Holded' });

    function render() {
      t.get('card', 'shared', 'holdedData')
        .then(function(data) {
          data = data || {};
          var tags = [];

          if (data.contactName) {
            var href = data.contactId ? HOLDED_CONTACT_URL + data.contactId : '#';
            var target = data.contactId ? ' target="_blank"' : '';
            var addrHtml = '';
            if (data.addressLabel) {
              addrHtml = ' <span class="tag-address" title="' + escapeHtml(data.addressLabel) + '">| ' + escapeHtml(data.addressLabel) + '</span>';
            }
            tags.push(
              '<a class="tag tag-contact" href="' + escapeHtml(href) + '"' + target + '>' +
                CONTACT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.contactName) + addrHtml + '</span>' +
                '<span class="tag-close" data-field="contact">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          } else {
            tags.push(
              '<button type="button" class="tag-add" data-link="contact">' +
                CONTACT_SVG +
                '<span>Vincula un cliente</span>' +
              '</button>'
            );
          }

          if (data.projectName) {
            var href = data.projectId ? HOLDED_PROJECT_URL + data.projectId : '#';
            var target = data.projectId ? ' target="_blank"' : '';
            tags.push(
              '<a class="tag tag-project" href="' + escapeHtml(href) + '"' + target + '>' +
                PROJECT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.projectName) + '</span>' +
                '<span class="tag-close" data-field="project">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          } else {
            tags.push(
              '<button type="button" class="tag-add" data-link="project">' +
                PROJECT_SVG +
                '<span>Vincula un proyecto</span>' +
              '</button>'
            );
          }

          var documentsHtml = data.contactId
            ? '<div id="documents" class="documents" data-contact-id="' + escapeHtml(data.contactId || '') + '" data-project-id="' + escapeHtml(data.projectId || '') + '"></div>'
            : '';
          contentDiv.innerHTML =
            '<div class="tags">' + tags.join('') + '</div>' +
            '<div id="important-message" data-contact-id="' + escapeHtml(data.contactId || '') + '"></div>' +
            documentsHtml;

          var closeBtns = contentDiv.querySelectorAll('.tag-close');
          for (var i = 0; i < closeBtns.length; i++) {
            closeBtns[i].addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              var field = this.getAttribute('data-field');
              var label = field === 'contact' ? 'cliente' : 'proyecto';
              // The card-back iframe can't reliably get a REST write token, so the
              // unlink (clear storage + remove the description tag) runs in a popup,
              // which has the same reliable REST context as the link flow. Opening
              // a popup from inside an iframe requires passing the mouse event.
              // The card re-renders via t.render() once the popup updates storage.
              t.popup({
                title: 'Desvincular ' + label,
                url: './src/popups/unlink.html?field=' + field,
                height: 150,
                mouseEvent: e,
              });
            });
          }

          var addBtns = contentDiv.querySelectorAll('.tag-add');
          for (var a = 0; a < addBtns.length; a++) {
            addBtns[a].addEventListener('click', function(e) {
              e.preventDefault();
              var link = this.getAttribute('data-link');
              // Same link flow as the card-button Power-Up actions, opened from the
              // card-back (an iframe popup needs the mouse event).
              t.popup({
                title: link === 'project' ? 'Buscar proyecto en Holded' : 'Buscar cliente en Holded',
                url: link === 'project' ? './src/popups/search-project.html' : './src/popups/search-contact.html',
                height: 400,
                mouseEvent: e,
              });
            });
          }

          refreshTrelloMessage(data);
          if (data.contactId) renderDocumentsCollapsed(data);
          t.sizeTo(contentDiv).catch(function() {});
        })
        .catch(function(err) {
          contentDiv.innerHTML = '<div style="color:red;padding:8px;font-size:12px;">Error: ' + err.message + '</div>';
        });
    }

    render();
    t.render(function() {
      render();
    });
  </script>
</body>
</html>
