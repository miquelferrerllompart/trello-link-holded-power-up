<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holded Info</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #172b4d;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      color: #44546f;
      margin-bottom: 6px;
    }
    .tags {
      display: grid;
      gap: 6px;
    }
    .tag {
      display: grid;
      grid-template-columns: 16px 12px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      max-width: 100%;
      line-height: 20px;
      transition: background 0.15s, color 0.15s;
    }
    .tag-contact {
      background: #e4f0f6;
      color: #0c66a1;
    }
    .tag-project {
      background: #e6f4ea;
      color: #1b7742;
    }
    .tag-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .tag-open-icon {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity 0.15s, transform 0.15s;
      fill: currentColor;
    }
    .tag:hover .tag-open-icon,
    .tag:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tag:hover .tag-name,
    .tag:focus-visible .tag-name {
      overflow: visible;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .tag-address {
      color: #5e6c84;
      font-weight: 400;
      font-size: 12px;
      cursor: help;
      white-space: nowrap;
    }
    .tag-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .tag:hover .tag-close,
    .tag:focus-within .tag-close {
      opacity: 1;
    }
    .tag-close-icon {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }
    .empty {
      color: #6b778c;
      font-size: 13px;
      padding: 4px 0;
    }
    .important-message {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid #f5cd47;
      border-radius: 6px;
      background: #fff7d6;
      color: #7f5f01;
      font-size: 13px;
      line-height: 18px;
      white-space: pre-line;
    }
    .important-label {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .documents {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #091e4224;
    }
    .documents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .documents-count {
      color: #626f86;
      font-size: 11px;
      line-height: 14px;
    }
    .documents-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .documents-hint {
      min-width: 0;
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
    }
    .documents-button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: #091e420f;
      color: #172b4d;
      cursor: pointer;
      flex: 0 0 auto;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      padding: 6px 10px;
    }
    .documents-button:hover {
      background: #091e4224;
    }
    .documents-button:focus-visible,
    .documents-tab:focus-visible,
    .documents-scope-button:focus-visible,
    .documents-page-button:focus-visible,
    .document-row:focus-visible {
      outline: 2px solid #388bff;
      outline-offset: 2px;
    }
    .documents-button[disabled] {
      cursor: default;
      opacity: 0.72;
    }
    .documents-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
      padding: 2px;
      border-radius: 8px;
      background: #091e420f;
    }
    .documents-tab {
      appearance: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #44546f;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      min-width: 0;
      padding: 5px 4px;
      text-align: center;
    }
    .documents-tab[aria-selected="true"] {
      background: #ffffff;
      color: #172b4d;
      box-shadow: 0 1px 2px #091e4224;
    }
    .documents-scope-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 2px 8px;
    }
    .documents-context {
      color: #626f86;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      white-space: nowrap;
    }
    .documents-scope {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      padding: 2px;
      border: 1px solid #091e4224;
      border-radius: 7px;
      background: #ffffff;
    }
    .documents-scope-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #626f86;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      padding: 4px 7px;
      white-space: nowrap;
    }
    .documents-scope-button:hover {
      background: #091e420f;
      color: #172b4d;
    }
    .documents-scope-button[aria-pressed="true"] {
      background: #e9f2ff;
      color: #0c66a1;
    }
    .documents-scope-count {
      min-width: 14px;
      border-radius: 999px;
      background: #091e420f;
      color: inherit;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 14px;
      padding: 0 4px;
      text-align: center;
    }
    .documents-scope-button[aria-pressed="true"] .documents-scope-count {
      background: #ffffffb8;
    }
    .document-list {
      display: grid;
      gap: 4px;
    }
    .document-row {
      display: grid;
      grid-template-columns: 12px minmax(74px, auto) 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      color: #172b4d;
      text-decoration: none;
    }
    .document-row:hover {
      background: #091e420f;
    }
    .document-row .tag-open-icon {
      opacity: 0;
      transform: translate(-2px, 2px);
    }
    .document-row:hover .tag-open-icon,
    .document-row:focus-visible .tag-open-icon {
      opacity: 1;
      transform: translate(0, 0);
    }
    .document-number {
      color: #0c66a1;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .document-meta {
      display: flex;
      min-width: 0;
      gap: 4px;
      flex-wrap: wrap;
    }
    .document-pill {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 16px;
      font-weight: 600;
      background: #091e420f;
      color: #44546f;
      white-space: nowrap;
    }
    .document-pill.served { background: #dcfff1; color: #216e4e; }
    .document-pill.partial { background: #fff7d6; color: #7f5f01; }
    .document-pill.pending { background: #f1f2f4; color: #44546f; }
    .document-pill.review { background: #fff7d6; color: #7f5f01; }
    .document-pill.cancelled,
    .document-pill.failed { background: #ffebe6; color: #ae2e24; }
    .document-date {
      color: #44546f;
      font-size: 12px;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .documents-note {
      color: #626f86;
      font-size: 12px;
      line-height: 16px;
      padding: 2px 0;
    }
    .documents-loading-label {
      color: #626f86;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      margin: 2px 8px 5px;
    }
    .documents-skeleton {
      display: grid;
      gap: 4px;
    }
    .documents-skeleton-row {
      position: relative;
      height: 30px;
      overflow: hidden;
      border-radius: 6px;
      background: #091e420f;
    }
    .documents-skeleton-row::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, #ffffff8f 48%, transparent 100%);
      content: '';
      transform: translateX(-100%);
      animation: documents-loading-sweep 1.35s ease-in-out infinite;
    }
    @keyframes documents-loading-sweep {
      to { transform: translateX(100%); }
    }
    .documents-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 28px;
      margin-top: 6px;
    }
    .documents-page-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .documents-page-button {
      appearance: none;
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: #091e420f;
      color: #172b4d;
      cursor: pointer;
      font: inherit;
      font-size: 20px;
      line-height: 20px;
      padding: 0 0 2px;
    }
    .documents-page-button:hover:not([disabled]) {
      background: #091e4224;
    }
    .documents-page-button[disabled] {
      cursor: default;
      opacity: 0.35;
    }
    .documents-page-label {
      min-width: 84px;
      color: #626f86;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
      text-align: center;
    }
    .documents-range {
      color: #626f86;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
      white-space: nowrap;
    }
    .documents-page-label strong {
      color: #172b4d;
      font-weight: 700;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { color: #b6c2cf; }
      .section-label { color: #a9abaf; }
      .tag-contact {
        background: rgba(0, 121, 191, 0.2);
        color: #579dff;
      }
      .tag-project {
        background: rgba(27, 119, 66, 0.2);
        color: #4bce97;
      }
      .tag-contact .tag-icon { fill: #579dff; }
      .tag-project .tag-icon { fill: #4bce97; }
      .tag-close-icon { fill: currentColor; }
      .tag-address { color: #8c9bab; }
      .empty { color: #8c9bab; }
      .important-message {
        background: rgba(245, 205, 71, 0.14);
        color: #f5cd47;
        border-left-color: #f5cd47;
      }
      .documents { border-top-color: #a6c5e229; }
      .documents-count,
      .documents-hint,
      .document-date,
      .documents-note,
      .documents-loading-label,
      .documents-range,
      .documents-page-label { color: #8c9bab; }
      .documents-button { background: #a6c5e229; color: #b6c2cf; }
      .documents-button:hover { background: #a6c5e23d; }
      .documents-tabs { background: #a6c5e229; }
      .documents-tab { color: #8c9bab; }
      .documents-tab[aria-selected="true"] {
        background: #1d2125;
        color: #b6c2cf;
        box-shadow: 0 1px 2px #030404;
      }
      .documents-context { color: #8c9bab; }
      .documents-scope { background: #1d2125; border-color: #a6c5e229; }
      .documents-scope-button { color: #8c9bab; }
      .documents-scope-button:hover { background: #a6c5e229; color: #b6c2cf; }
      .documents-scope-button[aria-pressed="true"] { background: #1c2b41; color: #579dff; }
      .documents-scope-count { background: #a6c5e229; }
      .documents-scope-button[aria-pressed="true"] .documents-scope-count { background: #579dff24; }
      .document-row { color: #b6c2cf; }
      .document-row:hover { background: #a6c5e229; }
      .document-number { color: #579dff; }
      .document-pill { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.served { background: rgba(75, 206, 151, 0.16); color: #4bce97; }
      .document-pill.partial { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.pending { background: #a1bdd914; color: #b6c2cf; }
      .document-pill.review { background: rgba(245, 205, 71, 0.14); color: #f5cd47; }
      .document-pill.cancelled,
      .document-pill.failed { background: rgba(248, 113, 104, 0.16); color: #f87168; }
      .documents-page-button { background: #a6c5e229; color: #b6c2cf; }
      .documents-page-button:hover:not([disabled]) { background: #a6c5e23d; }
      .documents-page-label strong { color: #b6c2cf; }
      .documents-skeleton-row { background: #a6c5e214; }
      .documents-skeleton-row::after { background: linear-gradient(90deg, transparent 0%, #a6c5e21f 48%, transparent 100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .documents-skeleton-row::after { animation: none; }
    }
    @media (max-width: 480px) {
      .documents-scope-row {
        align-items: stretch;
        flex-direction: column;
        gap: 4px;
      }
      .documents-context { margin-left: 5px; }
      .documents-scope {
        box-sizing: border-box;
        width: 100%;
      }
      .documents-scope-button {
        flex: 1 1 0;
        justify-content: center;
      }
      .document-row {
        grid-template-columns: 12px minmax(0, 1fr) auto;
      }
      .document-meta {
        grid-column: 2 / 4;
        grid-row: 2;
      }
      .document-date {
        grid-column: 3;
        grid-row: 1;
      }
      .documents-skeleton-row { height: 48px; }
    }
  </style>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

    var CONTACT_SVG = '<svg class="tag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M384 48c8.8 0 16 7.2 16 16l0 384c0 8.8-7.2 16-16 16L96 464c-8.8 0-16-7.2-16-16L80 64c0-8.8 7.2-16 16-16l288 0zM96 0C60.7 0 32 28.7 32 64l0 384c0 35.3 28.7 64 64 64l288 0c35.3 0 64-28.7 64-64l0-384c0-35.3-28.7-64-64-64L96 0zM240 248a56 56 0 1 0 0-112 56 56 0 1 0 0 112zm-32 40c-44.2 0-80 35.8-80 80 0 8.8 7.2 16 16 16l192 0c8.8 0 16-7.2 16-16 0-44.2-35.8-80-80-80l-64 0zM512 80c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64zM496 192c-8.8 0-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64c0-8.8-7.2-16-16-16zm16 144c0-8.8-7.2-16-16-16s-16 7.2-16 16l0 64c0 8.8 7.2 16 16 16s16-7.2 16-16l0-64z"/></svg>';

    var CLOSE_SVG = '<svg class="tag-close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>';

    // NOTE: This file is in public/ (no Vite processing). Keep in sync with VITE_TRELLO_APP_KEY in .env
    var TRELLO_API_KEY = '81d86f6c21c827e54947d36746561233';
    var TAG_REGEXES = {
      contact: /\{\{\s*contact:\s*[^}]*\}\}/g,
      project: /\{\{\s*project:\s*[^}]*\}\}/g,
    };

    function removeDescTag(desc, type) {
      return desc.replace(TAG_REGEXES[type], '').replace(/\n{3,}/g, '\n\n').trim();
    }

    function removeTagFromDescription(field) {
      t.card('id', 'desc').then(function(card) {
        var newDesc = removeDescTag(card.desc || '', field);
        if (newDesc === (card.desc || '').trim()) return;
        var restApi = t.getRestApi();
        restApi.getToken().then(function(token) {
          if (!token) return;
          fetch('https://api.trello.com/1/cards/' + card.id + '?key=' + TRELLO_API_KEY + '&token=' + token, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ desc: newDesc }),
          });
        });
      }).catch(function() {});
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function(char) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char];
      });
    }

    function extractTrelloCustomField(customFields) {
      if (!Array.isArray(customFields)) return '';

      var values = [];
      for (var i = 0; i < customFields.length; i++) {
        var field = customFields[i];
        if (!field || typeof field !== 'object') continue;

        var key = String(field.field || field.key || field.name || '').trim().toLowerCase();
        if (key !== 'trello') continue;

        var value = field.value;
        if (Array.isArray(value)) {
          value = value.map(function(item) { return String(item || '').trim(); }).filter(Boolean).join(', ');
        } else if (value && typeof value === 'object') {
          value = JSON.stringify(value);
        } else {
          value = String(value || '').trim();
        }

        if (value) values.push(value);
      }

      return values.join('\n');
    }

    function renderImportantMessage(message) {
      if (!message) return '';
      return '<div class="important-message">' +
        '<span class="important-label">Importante</span> ' +
        '<span class="important-body">' + escapeHtml(message) + '</span>' +
      '</div>';
    }

    function setImportantMessage(contactId, message) {
      var container = document.getElementById('important-message');
      if (!container || container.getAttribute('data-contact-id') !== contactId) return;

      container.innerHTML = renderImportantMessage(message);
      t.sizeTo(contentDiv).catch(function() {});
    }

    function getStatusLabel(status) {
      return ({
        pending: 'Pendiente',
        completed: 'Completado',
        partial: 'Parcial',
        cancelled: 'Cancelado',
        failed: 'Fallido',
        overdue: 'Vencido'
      })[status] || status || 'Sin estado';
    }

    function getStatusClass(status) {
      if (status === 'completed') return 'served';
      if (status === 'partial') return 'partial';
      if (status === 'cancelled' || status === 'failed') return status;
      return 'pending';
    }

    function getNumberValue(value) {
      var number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function getSalesOrderShipmentPill(documentItem) {
      var tracking = documentItem.shippedItems;
      if (!tracking || tracking.error) return { label: 'Sin datos envío', className: 'review' };

      var items = Array.isArray(tracking.items) ? tracking.items : [];
      var sent = 0;
      var pending = 0;
      var total = 0;

      for (var i = 0; i < items.length; i++) {
        sent += getNumberValue(items[i].sent);
        pending += getNumberValue(items[i].pending);
        total += getNumberValue(items[i].total);
      }

      if (pending <= 0 && sent !== 0) {
        var waybillStatuses = Array.isArray(tracking.waybillStatuses) ? tracking.waybillStatuses : [];
        var delivered = waybillStatuses.length > 0 && waybillStatuses.every(function(waybill) {
          return waybill.status === 'completed';
        });
        return delivered
          ? { label: 'Entregado', className: 'served' }
          : { label: 'Preparado', className: 'served' };
      }
      if (sent === 0 && pending > 0) return { label: 'Pendiente', className: 'pending' };
      if (sent > 0 && pending > 0) return { label: 'Parcial', className: 'partial' };
      return { label: 'Pendiente', className: 'pending' };
    }

    function getWaybillStatusPill(status) {
      if (status === 'completed') return { label: 'Aceptado', className: 'served' };
      if (status === 'pending') return { label: 'Pendiente', className: 'pending' };
      if (status === 'cancelled' || status === 'failed') return { label: getStatusLabel(status), className: status };
      return { label: getStatusLabel(status), className: getStatusClass(status) };
    }

    function getEstimateStatusPill(status) {
      if (status === 'completed') return { label: 'Aceptado', className: 'served' };
      if (status === 'cancelled') return { label: 'Denegado', className: 'cancelled' };
      return { label: getStatusLabel(status), className: getStatusClass(status) };
    }

    function getDocumentPills(documentItem) {
      if (documentItem.type === 'sales-orders') return [getSalesOrderShipmentPill(documentItem)];
      if (documentItem.type === 'waybills') return [getWaybillStatusPill(documentItem.status)];
      if (documentItem.type === 'estimates') return [getEstimateStatusPill(documentItem.status)];
      return [{ label: getStatusLabel(documentItem.status), className: getStatusClass(documentItem.status) }];
    }

    var DOCUMENT_TABS = [
      { key: 'salesOrders', type: 'sales-orders', label: 'Pedidos venta', loadingLabel: 'pedidos de venta', emptyClient: 'No hay pedidos de venta para este cliente.', emptyProject: 'No hay pedidos de venta en el proyecto vinculado.', emptyOther: 'No hay pedidos de venta en otros proyectos.' },
      { key: 'waybills', type: 'waybills', label: 'Albaranes', loadingLabel: 'albaranes', emptyClient: 'No hay albaranes para este cliente.', emptyProject: 'No hay albaranes en el proyecto vinculado.', emptyOther: 'No hay albaranes en otros proyectos.' },
      { key: 'estimates', type: 'estimates', label: 'Presupuestos', loadingLabel: 'presupuestos', emptyClient: 'No hay presupuestos para este cliente.', emptyProject: 'No hay presupuestos en el proyecto vinculado.', emptyOther: 'No hay presupuestos en otros proyectos.' },
    ];
    var DOCUMENT_PAGE_SIZE = 10;
    var documentsCache = {};
    var documentRequests = {};
    var documentErrors = {};
    var documentTotals = {};
    var documentViews = {};

    function getDocumentsViewKey(data) {
      return (data.contactId || '') + '|' + (data.projectId || '');
    }

    function getDocumentsView(data) {
      var key = getDocumentsViewKey(data);
      if (!documentViews[key]) {
        documentViews[key] = {
          expanded: false,
          activeKey: 'salesOrders',
          pages: {},
          otherPages: {},
          scope: 'matched',
        };
      }
      return documentViews[key];
    }

    function getDocumentTab(key) {
      return DOCUMENT_TABS.find(function(tab) { return tab.key === key; }) || DOCUMENT_TABS[0];
    }

    function getDocumentsPageKey(data, tab, scope, page) {
      return getDocumentsViewKey(data) + '|' + tab.type + '|' + scope + '|' + page;
    }

    function getDocumentsTotalsKey(data, tab) {
      return getDocumentsViewKey(data) + '|' + tab.type;
    }

    function formatDateLabel(value) {
      if (!value) return '';
      var text = String(value);
      var dateOnly = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (dateOnly) return dateOnly[3] + '/' + dateOnly[2] + '/' + dateOnly[1];

      var date = new Date(text);
      if (Number.isNaN(date.getTime())) return text;
      return date.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
      });
    }

    function getDocumentNumber(documentItem) {
      var fallback = documentItem.type === 'sales-orders' ? 'PV ' :
        documentItem.type === 'purchase-orders' ? 'PC ' :
        documentItem.type === 'estimates' ? 'PRE ' : 'ALB ';
      return documentItem.documentNumber || (fallback + documentItem.id.slice(-6));
    }

    function getDocumentDateText(documentItem) {
      if (documentItem.updatedAt) return 'Actualizado ' + formatDateLabel(documentItem.updatedAt);
      if (documentItem.date) return 'Creado ' + formatDateLabel(documentItem.date);
      return 'Sin fecha';
    }

    function renderDocumentRows(items, tab, scope, hasProject) {
      if (!items || items.length === 0) {
        var emptyMessage = scope === 'other'
          ? tab.emptyOther
          : (hasProject ? tab.emptyProject : tab.emptyClient);
        return '<div class="documents-note">' + emptyMessage + '</div>';
      }

      return '<div class="document-list">' + items.map(function(documentItem) {
        var number = getDocumentNumber(documentItem);
        var url = documentItem.url || '#';
        var pills = getDocumentPills(documentItem).map(function(pill) {
          return '<span class="document-pill ' + pill.className + '">' + escapeHtml(pill.label) + '</span>';
        }).join('');

        return '<a class="document-row" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
          OPEN_LINK_SVG +
          '<span class="document-number">#' + escapeHtml(number) + '</span>' +
          '<span class="document-meta">' +
            pills +
          '</span>' +
          '<span class="document-date">' + escapeHtml(getDocumentDateText(documentItem)) + '</span>' +
        '</a>';
      }).join('') + '</div>';
    }

    function renderDocumentsLoading(tab) {
      return '<div class="documents-loading" role="status">' +
        '<div class="documents-loading-label">Cargando ' + tab.loadingLabel + '…</div>' +
        '<div class="documents-skeleton" aria-hidden="true">' +
          '<div class="documents-skeleton-row"></div>' +
          '<div class="documents-skeleton-row"></div>' +
          '<div class="documents-skeleton-row"></div>' +
        '</div>' +
      '</div>';
    }

    function renderPagination(result, scope) {
      if (!result || result.totalPages <= 1) return '';

      var previousDisabled = result.page <= 1 ? ' disabled' : '';
      var nextDisabled = result.page >= result.totalPages ? ' disabled' : '';
      var scopeLabel = scope === 'other' ? 'otros documentos' : 'documentos del proyecto';
      var rangeStart = ((result.page - 1) * result.pageSize) + 1;
      var rangeEnd = Math.min(result.page * result.pageSize, result.total);

      return '<div class="documents-pagination" role="navigation" aria-label="Paginación de ' + scopeLabel + '">' +
        '<span class="documents-range">' + rangeStart + '–' + rangeEnd + ' de ' + result.total + '</span>' +
        '<div class="documents-page-controls">' +
          '<button type="button" class="documents-page-button" data-page-scope="' + scope + '" data-page="' + (result.page - 1) + '" aria-label="Página anterior"' + previousDisabled + '>‹</button>' +
          '<span class="documents-page-label">Página <strong>' + result.page + '</strong> de ' + result.totalPages + '</span>' +
          '<button type="button" class="documents-page-button" data-page-scope="' + scope + '" data-page="' + (result.page + 1) + '" aria-label="Página siguiente"' + nextDisabled + '>›</button>' +
        '</div>' +
      '</div>';
    }

    function renderDocumentScope(data, tab, view) {
      var totals = documentTotals[getDocumentsTotalsKey(data, tab)] || {};
      var matchedTotal = typeof totals.total === 'number' ? totals.total : '…';
      var otherTotal = typeof totals.otherTotal === 'number' ? totals.otherTotal : '…';

      if (!data.projectId) {
        return '<div class="documents-context">Este cliente</div>';
      }

      return '<div class="documents-scope-row">' +
        '<span class="documents-context">Este cliente</span>' +
        '<div class="documents-scope" aria-label="Ámbito de documentos">' +
          '<button type="button" class="documents-scope-button" data-document-scope="matched" aria-pressed="' + (view.scope === 'matched' ? 'true' : 'false') + '">' +
            '<span>Proyecto vinculado</span> <span class="documents-scope-count">' + matchedTotal + '</span>' +
          '</button>' +
          '<button type="button" class="documents-scope-button" data-document-scope="other" aria-pressed="' + (view.scope === 'other' ? 'true' : 'false') + '">' +
            '<span>Otros proyectos</span> <span class="documents-scope-count">' + otherTotal + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
    }

    function ensureDocumentsPage(data, tab, scope, page) {
      var cacheKey = getDocumentsPageKey(data, tab, scope, page);
      if (documentsCache[cacheKey] || documentRequests[cacheKey]) return;

      var params = new URLSearchParams({
        contactId: data.contactId,
        type: tab.type,
        scope: scope,
        page: String(page),
        pageSize: String(DOCUMENT_PAGE_SIZE),
      });
      if (data.projectId) params.set('projectId', data.projectId);

      documentRequests[cacheKey] = true;
      delete documentErrors[cacheKey];

      fetch(HOLDED_PROXY_URL + '/documents/search?' + params.toString())
        .then(function(response) {
          if (!response.ok) throw new Error('Holded API error: ' + response.status);
          return response.json();
        })
        .then(function(result) {
          delete documentRequests[cacheKey];
          documentsCache[cacheKey] = result;
          documentsCache[getDocumentsPageKey(data, tab, scope, result.page)] = result;
          var totalsKey = getDocumentsTotalsKey(data, tab);
          var existingTotals = documentTotals[totalsKey] || {};
          documentTotals[totalsKey] = {
            total: result.scope === 'matched' ? result.total : existingTotals.total,
            otherTotal: result.otherTotal,
          };
          renderDocumentsPanel(data);
        })
        .catch(function(err) {
          delete documentRequests[cacheKey];
          documentErrors[cacheKey] = true;
          console.warn('Holded: error loading documents', err);
          renderDocumentsPanel(data);
        });
    }

    function renderDocumentsPanel(data) {
      var container = document.getElementById('documents');
      if (!container ||
        container.getAttribute('data-contact-id') !== (data.contactId || '') ||
        container.getAttribute('data-project-id') !== (data.projectId || '')) return;

      var view = getDocumentsView(data);
      var activeTab = getDocumentTab(view.activeKey);
      var scope = view.scope === 'other' ? 'other' : 'matched';
      var page = scope === 'other'
        ? (view.otherPages[activeTab.key] || 1)
        : (view.pages[activeTab.key] || 1);
      var cacheKey = getDocumentsPageKey(data, activeTab, scope, page);
      var result = documentsCache[cacheKey];
      var content = '';

      if (result) {
        if (result.page !== page) {
          if (scope === 'other') view.otherPages[activeTab.key] = result.page;
          else view.pages[activeTab.key] = result.page;
        }
        content = renderDocumentRows(result.results || [], activeTab, scope, !!data.projectId) +
          renderPagination(result, scope);
      } else if (documentErrors[cacheKey]) {
        content = '<div class="documents-note">No se pudieron cargar los documentos.</div>' +
          '<button type="button" class="documents-button documents-retry">Reintentar</button>';
      } else {
        content = renderDocumentsLoading(activeTab);
      }

      var tabs = DOCUMENT_TABS.map(function(tab) {
        var totals = documentTotals[getDocumentsTotalsKey(data, tab)];
        var count = totals && typeof totals.total === 'number' ? ' ' + totals.total : '';
        return '<button type="button" role="tab" id="documents-tab-' + tab.key + '" class="documents-tab" data-tab="' + tab.key + '" aria-controls="documents-panel" aria-selected="' + (tab.key === activeTab.key ? 'true' : 'false') + '" tabindex="' + (tab.key === activeTab.key ? '0' : '-1') + '">' +
          escapeHtml(tab.label) + count +
        '</button>';
      }).join('');

      var countLabel = result
        ? result.total + (result.total === 1 ? ' documento' : ' documentos')
        : '…';

      container.innerHTML =
        '<div class="documents-header">' +
          '<div class="section-label">Documentos Holded</div>' +
          '<div class="documents-count">' + countLabel + '</div>' +
        '</div>' +
        '<div class="documents-tabs" role="tablist">' + tabs + '</div>' +
        '<div id="documents-panel" role="tabpanel" aria-labelledby="documents-tab-' + activeTab.key + '" aria-live="polite" aria-busy="' + (!result && !documentErrors[cacheKey] ? 'true' : 'false') + '">' +
          renderDocumentScope(data, activeTab, view) +
          content +
        '</div>';

      var buttons = container.querySelectorAll('.documents-tab');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener('click', function() {
          view.activeKey = this.getAttribute('data-tab') || 'salesOrders';
          view.scope = 'matched';
          view.pendingTabFocus = null;
          renderDocumentsPanel(data);
        });
        buttons[i].addEventListener('keydown', function(event) {
          var currentIndex = DOCUMENT_TABS.findIndex(function(tab) {
            return tab.key === (event.currentTarget.getAttribute('data-tab') || 'salesOrders');
          });
          var targetIndex = currentIndex;

          if (event.key === 'ArrowRight') targetIndex = (currentIndex + 1) % DOCUMENT_TABS.length;
          else if (event.key === 'ArrowLeft') targetIndex = (currentIndex - 1 + DOCUMENT_TABS.length) % DOCUMENT_TABS.length;
          else if (event.key === 'Home') targetIndex = 0;
          else if (event.key === 'End') targetIndex = DOCUMENT_TABS.length - 1;
          else return;

          event.preventDefault();
          view.activeKey = DOCUMENT_TABS[targetIndex].key;
          view.scope = 'matched';
          view.pendingTabFocus = view.activeKey;
          renderDocumentsPanel(data);
        });
      }

      var scopeButtons = container.querySelectorAll('.documents-scope-button');
      for (var scopeIndex = 0; scopeIndex < scopeButtons.length; scopeIndex++) {
        scopeButtons[scopeIndex].addEventListener('click', function() {
          view.scope = this.getAttribute('data-document-scope') === 'other' ? 'other' : 'matched';
          renderDocumentsPanel(data);
        });
      }

      var pageButtons = container.querySelectorAll('.documents-page-button:not([disabled])');
      for (var j = 0; j < pageButtons.length; j++) {
        pageButtons[j].addEventListener('click', function() {
          var targetPage = Number(this.getAttribute('data-page')) || 1;
          if (this.getAttribute('data-page-scope') === 'other') {
            view.otherPages[activeTab.key] = targetPage;
          } else {
            view.pages[activeTab.key] = targetPage;
          }
          renderDocumentsPanel(data);
        });
      }

      var retryButton = container.querySelector('.documents-retry');
      if (retryButton) {
        retryButton.addEventListener('click', function() {
          delete documentErrors[cacheKey];
          renderDocumentsPanel(data);
        });
      }

      if (!result && !documentErrors[cacheKey]) {
        ensureDocumentsPage(data, activeTab, scope, page);
      }

      if (view.pendingTabFocus) {
        var focusTarget = container.querySelector('[data-tab="' + view.pendingTabFocus + '"]');
        if (focusTarget) focusTarget.focus();
        if (result && view.pendingTabFocus === activeTab.key) view.pendingTabFocus = null;
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function renderDocumentsCollapsed(data) {
      var container = document.getElementById('documents');
      if (!container) return;

      var view = getDocumentsView(data);
      if (view.expanded) {
        renderDocumentsPanel(data);
        return;
      }

      var hint = data.projectId
        ? 'Filtrados por cliente y proyecto'
        : 'Documentos del cliente vinculado';

      container.innerHTML =
        '<div class="documents-summary">' +
          '<div>' +
            '<div class="section-label">Documentos Holded</div>' +
            '<div class="documents-hint">' + hint + '</div>' +
          '</div>' +
          '<button type="button" class="documents-button" id="load-documents">Cargar documentos</button>' +
        '</div>';

      var button = document.getElementById('load-documents');
      if (button) {
        button.addEventListener('click', function() {
          view.expanded = true;
          renderDocumentsPanel(data);
        });
      }

      t.sizeTo(contentDiv).catch(function() {});
    }

    function refreshTrelloMessage(data) {
      if (!data.contactId) return;
      var contactId = data.contactId;

      fetch(HOLDED_PROXY_URL + '/api/v2/contacts/' + encodeURIComponent(contactId))
        .then(function(response) {
          if (!response.ok) throw new Error('Holded API error: ' + response.status);
          return response.json();
        })
        .then(function(contact) {
          setImportantMessage(contactId, extractTrelloCustomField(contact.customFields || contact.custom_fields));
        })
        .catch(function(err) {
          console.warn('Holded: error loading Trello custom field', err);
        });
    }

    var contentDiv = document.getElementById('content');
    // NOTE: Keep appKey in sync with VITE_TRELLO_APP_KEY in .env
    var t = window.TrelloPowerUp.iframe({ appKey: '81d86f6c21c827e54947d36746561233', appName: 'Holded' });

    function render() {
      t.get('card', 'shared', 'holdedData')
        .then(function(data) {
          data = data || {};
          var tags = [];

          if (data.contactName) {
            var href = data.contactId ? HOLDED_CONTACT_URL + data.contactId : '#';
            var target = data.contactId ? ' target="_blank"' : '';
            var addrHtml = '';
            if (data.addressLabel) {
              addrHtml = ' <span class="tag-address" title="' + escapeHtml(data.addressLabel) + '">| ' + escapeHtml(data.addressLabel) + '</span>';
            }
            tags.push(
              '<a class="tag tag-contact" href="' + escapeHtml(href) + '"' + target + '>' +
                CONTACT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.contactName) + addrHtml + '</span>' +
                '<span class="tag-close" data-field="contact">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          }

          if (data.projectName) {
            var href = data.projectId ? HOLDED_PROJECT_URL + data.projectId : '#';
            var target = data.projectId ? ' target="_blank"' : '';
            tags.push(
              '<a class="tag tag-project" href="' + escapeHtml(href) + '"' + target + '>' +
                PROJECT_SVG +
                OPEN_LINK_SVG +
                '<span class="tag-name">' + escapeHtml(data.projectName) + '</span>' +
                '<span class="tag-close" data-field="project">' + CLOSE_SVG + '</span>' +
              '</a>'
            );
          }

          if (tags.length === 0) {
            contentDiv.innerHTML = '<div class="empty">No hay datos vinculados.</div>';
          } else {
            var documentsHtml = data.contactId
              ? '<div id="documents" class="documents" data-contact-id="' + escapeHtml(data.contactId || '') + '" data-project-id="' + escapeHtml(data.projectId || '') + '"></div>'
              : '';
            contentDiv.innerHTML =
              '<div class="tags">' + tags.join('') + '</div>' +
              '<div id="important-message" data-contact-id="' + escapeHtml(data.contactId || '') + '"></div>' +
              documentsHtml;
          }

          var closeBtns = contentDiv.querySelectorAll('.tag-close');
          for (var i = 0; i < closeBtns.length; i++) {
            closeBtns[i].addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              var field = this.getAttribute('data-field');
              var label = field === 'contact' ? 'cliente' : 'proyecto';
              if (!confirm('¿Desvincular ' + label + '?')) return;
              t.get('card', 'shared', 'holdedData').then(function(current) {
                current = current || {};
                if (field === 'contact') {
                  delete current.contactId;
                  delete current.contactName;
                  delete current.addressLabel;
                } else {
                  delete current.projectId;
                  delete current.projectName;
                }
                t.set('card', 'shared', 'holdedData', current).then(function() {
                  removeTagFromDescription(field);
                  render();
                });
              });
            });
          }

          refreshTrelloMessage(data);
          if (data.contactId) renderDocumentsCollapsed(data);
          t.sizeTo(contentDiv).catch(function() {});
        })
        .catch(function(err) {
          contentDiv.innerHTML = '<div style="color:red;padding:8px;font-size:12px;">Error: ' + err.message + '</div>';
        });
    }

    render();
    t.render(function() {
      render();
    });
  </script>
</body>
</html>
